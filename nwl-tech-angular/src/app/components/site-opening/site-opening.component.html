@if (visible()) {
  <div
    class="site-loader"
    [class.site-loader--leaving]="leaving()"
    role="status"
    aria-live="polite"
    aria-label="Carregando o site da NWL"
  >
    <div class="site-loader__content">
      <div class="site-loader__brand" [class.site-loader__brand--ready]="animationReady()">
        <div class="site-loader__globe" aria-hidden="true">
          <app-connectivity-scene (ready)="onSceneReady()" aria-hidden="true" />
        </div>
        <p class="site-loader__eyebrow">NWL · SOLUÇÕES TECNOLÓGICAS</p>
        <p class="site-loader__title">Conectando sua empresa.</p>
      </div>
      <div
        class="site-loader__track"
        role="progressbar"
        aria-label="Carregamento do site"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progress()"
      >
        <span class="site-loader__track-fill" [style.width.%]="progress()"></span>
      </div>
    </div>
  </div>
}
