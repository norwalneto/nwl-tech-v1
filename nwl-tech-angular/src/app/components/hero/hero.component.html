<section class="hero wrap" id="inicio" aria-labelledby="hero-title">
  <div class="hero-atmosphere" aria-hidden="true">
    <span class="hero-aura" data-hero-aura></span>
    <span class="hero-particle particle-one" data-hero-particle></span>
    <span class="hero-particle particle-two" data-hero-particle></span>
    <span class="hero-particle particle-three" data-hero-particle></span>
    <span class="hero-particle particle-four" data-hero-particle></span>
  </div>

  <div class="hero-copy">
    <p class="eyebrow" data-hero-eyebrow><span aria-hidden="true"></span> TECNOLOGIA A FAVOR DA SUA EMPRESA</p>
    <h1 id="hero-title">
      <span class="hero-line"><span data-hero-line>Conecte.</span></span>
      <span class="hero-line"><span data-hero-line>Proteja.</span></span>
      <span class="hero-line"><span data-hero-line><em>Fortaleça.</em></span></span>
    </h1>
    <p class="hero-description" data-hero-description>
      Da infraestrutura à presença digital, soluções para cuidar da tecnologia que faz seu negócio
      funcionar.
    </p>
    <div class="hero-actions">
      <a
        class="button primary"
        data-hero-cta
        [href]="whatsappUrl('Olá, gostaria de solicitar um orçamento com a NWL.')"
      >
        Solicitar um orçamento <span aria-hidden="true">↗</span>
      </a>
      <a class="button secondary" data-hero-cta href="#servicos">
        Conhecer soluções <span aria-hidden="true">↓</span>
      </a>
    </div>
    <p class="hero-note" data-hero-note>Converse diretamente com a NWL pelo WhatsApp.</p>
  </div>

  <div class="hero-logo" data-hero-logo>
    <app-connectivity-scene
      role="img"
      aria-label="Logo da NWL Soluções Tecnológicas: globo de conectividade e letras NWL"
    ></app-connectivity-scene>
  </div>
</section>
